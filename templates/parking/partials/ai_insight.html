<div class="glass-card p-4 text-start shadow-lg border-primary mb-0 mt-3 animate-enter" style="animation-duration: 0.5s;">
    <h5 class="fw-bold border-bottom pb-3 mb-4"><i class="fa-solid fa-robot text-primary me-2"></i> Artificial Intelligence Analysis</h5>
    
    <div class="row text-center mb-4 g-3">
        <div class="col-md-4">
            <div class="p-3 bg-light rounded-3 h-100 border">
                <span class="text-muted d-block small mb-1">{{ date1 }} (Point A)</span>
                <h3 class="fw-bold mb-0">₹{{ rev1|floatformat:2 }}</h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="p-3 bg-light rounded-3 h-100 border position-relative">
                <span class="text-muted d-block small mb-1">Delta / Growth Pivot</span>
                <h3 class="fw-bold mb-0 {% if growth > 0 %}text-success{% elif growth < 0 %}text-danger{% else %}text-muted{% endif %}">
                    {% if growth > 0 %}+{% endif %}{{ growth|floatformat:1 }}%
                </h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="p-3 bg-light rounded-3 h-100 border">
                <span class="text-muted d-block small mb-1">{{ date2 }} (Point B)</span>
                <h3 class="fw-bold mb-0">₹{{ rev2|floatformat:2 }}</h3>
            </div>
        </div>
    </div>
    
    <div class="p-4 rounded-3 text-dark d-flex align-items-start" style="background: rgba(0, 102, 204, 0.05); border-left: 4px solid var(--apple-blue);">
        <i class="fa-solid fa-wand-magic-sparkles text-primary fa-2x me-3 mt-1"></i>
        <div>
            <h6 class="fw-bold mb-2">Automated Business Advice</h6>
            <p class="mb-0 text-muted lh-lg" style="font-size: 1.05rem;">{{ advice }}</p>
        </div>
    </div>
</div>
